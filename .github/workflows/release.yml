name: Release

# Builds standalone desktop-app binaries for Linux, Windows and macOS and
# attaches them (plus the Python wheel/sdist) to the GitHub Release for a tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach assets to (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-app:
    name: Build app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mobiot-linux-x86_64
            ext: ""
          - os: windows-latest
            artifact: mobiot-windows-x86_64
            ext: ".exe"
          - os: macos-latest
            artifact: mobiot-macos-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install project (GUI) + MobSF + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" mobsf pyinstaller

      - name: Vendor native tools (JRE, jadx, adb, frida-server)
        run: python packaging/fetch_vendor.py

      - name: Build self-contained bundle
        run: pyinstaller --noconfirm --clean packaging/mobiot.spec

      - name: Package bundle as zip
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('${{ matrix.artifact }}', 'zip', 'dist', 'mobiot')"

      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Attach bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: ${{ matrix.artifact }}.zip
          fail_on_unmatched_files: true

  build-python:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Attach wheel + sdist to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: |
            dist/*.whl
            dist/*.tar.gz
