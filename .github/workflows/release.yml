name: Release

# Builds standalone desktop-app bundles for Linux, Windows and macOS and
# attaches them (plus the Python wheel/sdist and .sha256 checksums) to a GitHub
# Release whose notes are generated from CHANGELOG.md for the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and attach assets to (e.g. v0.3.1)"
        required: true
        default: "v0.3.1"

permissions:
  contents: write

jobs:
  build-app:
    name: Build app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: MSRF-linux-x86_64
          - os: windows-latest
            artifact: MSRF-windows-x86_64
          - os: macos-latest
            artifact: MSRF-macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Install project (GUI) + MobSF + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install ".[gui]" mobsf pyinstaller

      - name: Vendor native tools (JRE, jadx, adb, frida-server)
        run: python packaging/fetch_vendor.py

      - name: Build self-contained bundle
        run: pyinstaller --noconfirm --clean packaging/mobiot.spec

      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Generate release notes from CHANGELOG
        shell: bash
        run: python packaging/extract_changelog.py "${{ steps.tag.outputs.name }}" > RELEASE_NOTES.md

      - name: Package portable bundle + checksum
        shell: bash
        run: |
          python -c "import shutil; shutil.make_archive('${{ matrix.artifact }}', 'zip', 'dist', 'mobiot')"
          python -c "import hashlib,sys; p='${{ matrix.artifact }}.zip'; open(p+'.sha256','w').write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+'\n')"

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = "${{ steps.tag.outputs.name }}".TrimStart('v')
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc "/DVersion=$v" "/DSource=dist\mobiot" "packaging\installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          $setup = "dist\MSRF-$v-setup.exe"
          (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower() + "  " + (Split-Path $setup -Leaf) | Out-File -Encoding ascii "$setup.sha256"

      - name: Attach portable bundle to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Mobile Security and Research Framework ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.zip.sha256
          fail_on_unmatched_files: true

      - name: Attach Windows installer to release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Mobile Security and Research Framework ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/MSRF-*-setup.exe
            dist/MSRF-*-setup.exe.sha256
          fail_on_unmatched_files: true

  build-python:
    name: Build wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Checksums
        shell: bash
        run: |
          cd dist
          for f in *.whl *.tar.gz; do python -c "import hashlib,sys; p='$f'; open(p+'.sha256','w').write(hashlib.sha256(open(p,'rb').read()).hexdigest()+'  '+p+'\n')"; done
      - name: Resolve tag
        id: tag
        shell: bash
        run: echo "name=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - name: Generate release notes from CHANGELOG
        shell: bash
        run: python packaging/extract_changelog.py "${{ steps.tag.outputs.name }}" > RELEASE_NOTES.md
      - name: Attach wheel + sdist to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Mobile Security and Research Framework ${{ steps.tag.outputs.name }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.sha256
