[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msrf"
version = "0.3.9"
description = "Unified, cross-platform Mobile & IoT SAST/DAST/pentest toolkit with a CLI and MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Keyur Aghao" }]
keywords = [
    "mobile security", "iot security", "sast", "dast", "pentest",
    "frida", "mobsf", "mitmproxy", "objection", "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

# Core runtime dependencies. External binaries (adb, nmap, binwalk, wkhtmltopdf)
# are discovered on PATH at runtime and are documented in the README.
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "psutil>=5.9",
    "fastmcp>=2.0",
    "defusedxml>=0.7",
    "waitress>=3.0",
    "openpyxl>=3.1",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# Heavy engine backends. Installed by default in the project venv, but optional
# for lightweight consumers that only need part of the toolkit.
frida = ["frida>=17.0", "frida-tools>=13.0", "objection>=1.11"]
proxy = ["mitmproxy>=11.0"]
mobsf = ["mobsf>=4.5"]
qr = ["qrcode>=7.4"]
gui = ["PyQt6>=6.6"]
all = [
    "frida>=17.0", "frida-tools>=13.0", "objection>=1.11",
    "mitmproxy>=11.0", "qrcode>=7.4", "PyQt6>=6.6",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/keyuraghao/Mobile-Security-Research-Framework"
Repository = "https://github.com/keyuraghao/Mobile-Security-Research-Framework"
Issues = "https://github.com/keyuraghao/Mobile-Security-Research-Framework/issues"

[project.scripts]
msrf = "msrf.cli:run"
msrf-mcp = "msrf.mcp_server:main"

[project.gui-scripts]
msrf-gui = "msrf.gui:run"

[tool.hatch.build.targets.wheel]
packages = ["src/msrf"]
# Package data (Frida templates, manifest) lives under src/msrf/data and is
# included automatically as part of the package.
artifacts = ["src/msrf/data/**/*"]

[tool.hatch.build.targets.sdist]
include = ["src/msrf", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = [
    "S101",  # allow assert
    "S104",  # binding to 0.0.0.0 is intentional for the proxy/MCP listeners
    "S110",  # try/except/pass used deliberately with documented fallbacks
    "S603",  # subprocess calls are argv-list + shell=False by construction
    "S607",  # tools are resolved via PATH cross-platform (shutil.which)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"src/msrf/cli.py" = ["B008"]  # typer.Option/Argument defaults are the Typer idiom
"src/msrf/gui/*" = ["E501", "SIM118"]  # long QSS/HTML/lambda lines; Qt .keys() is not a dict
"src/msrf/report_format.py" = ["E501"]  # descriptive display strings
"src/msrf/reporting.py" = ["E501"]  # long HTML/report template strings
"src/msrf/engines/emulator.py" = ["E501"]  # long download/tool URLs

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.12"
packages = ["msrf"]
ignore_missing_imports = true
